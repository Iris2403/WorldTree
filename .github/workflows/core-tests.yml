name: Core tests

# Runs the engine-free WorldTree.Core tests with .NET, without Unity (architecture §9).
on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test tools/CoreTests --logger "console;verbosity=normal"
